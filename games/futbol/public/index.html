<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Online Futbol</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- ------------------------------------------------------- LOBBY -->
  <section id="lobby" class="screen lobby">
    <div class="card">
      <h1>⚽ Online Futbol</h1>
      <p class="sub">2D · 5'li · gerçek zamanlı çok oyunculu</p>

      <label for="nameInput">Takma ad</label>
      <input id="nameInput" maxlength="16" placeholder="Oyuncu" autocomplete="nickname" />

      <label for="roomInput">Oda kodu</label>
      <div class="row">
        <input id="roomInput" maxlength="8" placeholder="Boş bırak = yeni oda" autocomplete="off" />
        <button id="newRoomBtn" class="ghost" type="button">Rastgele</button>
      </div>

      <button id="playBtn" class="primary" type="button">Oyuna gir</button>
      <p id="lobbyStatus" class="status">Sunucuya bağlanılıyor…</p>

      <div class="rooms">
        <h4>Aktif odalar</h4>
        <ul id="roomList" class="room-list">
          <li class="empty">Bağlanılıyor…</li>
        </ul>
      </div>

      <div class="legend">
        <span><b>WASD / Oklar</b> hareket</span>
        <span><b>Boşluk</b> şut</span>
        <span><b>Shift</b> koş</span>
        <span><b>E</b> pas</span>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------- OYUN -->
  <section id="game" class="screen game hidden">
    <header class="hud-top">
      <div class="team t0"><span class="tname">Mavi</span><span class="score" id="score0">0</span></div>
      <div class="mid">
        <span id="timeLabel">1:30</span>
        <span id="halfLabel">1. Devre</span>
      </div>
      <div class="team t1"><span class="score" id="score1">0</span><span class="tname">Kırmızı</span></div>
    </header>

    <div class="canvas-wrap">
      <canvas id="pitch"></canvas>
      <div id="centerMsg" class="center-msg hidden">
        <div id="centerText"></div>
        <button id="againBtn" class="primary hidden" type="button">Yeniden oyna</button>
      </div>
      <div id="toast" class="toast hidden"></div>
    </div>

    <aside class="side">
      <div class="panel">
        <h3>Oyuncular</h3>
        <ul id="rosterList" class="roster"></ul>
      </div>
      <div class="panel">
        <h3>Chat</h3>
        <div id="chatLog" class="chat-log"></div>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" maxlength="120" placeholder="Mesaj yaz…" autocomplete="off" />
          <button type="submit">›</button>
        </form>
      </div>
      <div class="panel small">
        <div>Ping: <b id="pingVal">–</b> ms</div>
        <div>Bağlantı: <b id="connVal">–</b></div>
      </div>
    </aside>

    <div id="touchControls" class="touch hidden">
      <div id="joystick" class="joystick"><div id="stick" class="stick"></div></div>
      <div class="touch-buttons">
        <button id="btnPass" class="tbtn" type="button">PAS</button>
        <button id="btnShoot" class="tbtn big" type="button">ŞUT</button>
      </div>
    </div>
  </section>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
